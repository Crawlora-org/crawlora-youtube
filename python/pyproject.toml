[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "crawlora-youtube"
version = "0.1.9"
description = "Crawlora YouTube API client with 14 endpoints for search, channels, videos, playlists, comments, captions, and transcripts"
readme = "README.md"
keywords = ["crawlora", "api-client", "sdk", "web-scraping", "scraping-api", "youtube", "youtube-api", "youtube-scraper", "youtube-data", "youtube-search", "youtube-channels", "youtube-videos", "youtube-playlists", "youtube-comments", "youtube-captions", "youtube-transcripts"]
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Crawlora" }]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Typing :: Typed",
]
dependencies = ["typing-extensions>=4.7; python_version < '3.11'"]

[project.optional-dependencies]
async = ["httpx>=0.27"]
test = ["mypy>=1.11", "pytest>=8"]

[project.urls]
Homepage = "https://crawlora.net/?utm_source=pypi&utm_medium=referral&utm_campaign=platform-clients&utm_content=youtube-python-homepage"
Documentation = "https://crawlora.net/docs?utm_source=pypi&utm_medium=referral&utm_campaign=platform-clients&utm_content=youtube-python-api-docs"
Repository = "https://github.com/Crawlora-org/crawlora-youtube"

[tool.setuptools.packages.find]
where = ["."]
include = ["crawlora_youtube"]

[tool.setuptools.package-data]
"crawlora_youtube" = ["py.typed", "*.pyi"]
